<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{min-height:100vh;background:#050505;color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
    .container{width:100%;max-width:520px;text-align:center}
    .logo{font-size:42px;font-weight:800;margin-bottom:10px}.logo span{color:#ff0050}
    .subtitle{color:#aaa;font-size:15px;margin-bottom:30px}
    .card{background:#111;border:1px solid #222;border-radius:20px;padding:25px;box-shadow:0 15px 50px #0008}
    .input-box{display:flex;gap:10px;background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:6px}
    input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:13px;font-size:14px}
    input::placeholder{color:#777}
    button{cursor:pointer}.paste-btn{border:0;background:#292929;color:#ddd;padding:0 15px;border-radius:9px}
    .download-btn{width:100%;margin-top:15px;padding:15px;border:0;border-radius:12px;background:#ff0050;color:#fff;font-size:16px;font-weight:bold}
    .download-btn:hover{background:#e60048}.download-btn:disabled{opacity:.6;cursor:not-allowed}
    .result{display:none;margin-top:20px;background:#181818;border-radius:15px;padding:15px;text-align:left}
    .result-title{font-weight:bold;margin-bottom:10px}
    .download-option{width:100%;padding:12px;margin-top:8px;border:1px solid #333;border-radius:10px;background:#222;color:#fff}
    .info{margin-top:22px;color:#777;font-size:12px;line-height:1.6}
    footer{margin-top:25px;color:#555;font-size:12px}
    @media(max-width:480px){.logo{font-size:34px}.card{padding:18px}.input-box{flex-direction:column}.paste-btn{padding:11px}}
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">Tik<span>Tok</span> Downloader</div>
    <p class="subtitle">Download video TikTok dengan mudah</p>

    <div class="card">
      <div class="input-box">
        <input id="url" type="text" placeholder="Tempel link TikTok di sini..." autocomplete="off">
        <button class="paste-btn" onclick="pasteURL()">Paste</button>
      </div>

      <button id="downloadBtn" class="download-btn" onclick="downloadVideo()">
        Download Video
      </button>

      <div class="result" id="result">
        <div class="result-title">Hasil Download</div>
        <button id="videoBtn" class="download-option" style="display:none">
          Download MP4 — Tanpa Watermark
        </button>
        <button id="audioBtn" class="download-option" style="display:none">
          Download MP3
        </button>
      </div>

      <div class="info">
        Gunakan hanya untuk konten yang kamu miliki atau kamu punya izin untuk mengunduhnya.
      </div>
    </div>

    <footer>© 2026 TikTok Downloader</footer>
  </main>

  <script>
    async function pasteURL() {
      try {
        document.getElementById("url").value =
          await navigator.clipboard.readText();
      } catch {
        alert("Clipboard tidak dapat diakses. Silakan tempel link secara manual.");
      }
    }

    async function downloadVideo() {
      const input = document.getElementById("url");
      const btn = document.getElementById("downloadBtn");
      const result = document.getElementById("result");
      const videoBtn = document.getElementById("videoBtn");
      const audioBtn = document.getElementById("audioBtn");
      const url = input.value.trim();

      if (!url) return alert("Silakan masukkan link TikTok terlebih dahulu.");
      if (!/^https?:\/\/([a-z0-9-]+\.)?tiktok\.com\//i.test(url)) {
        return alert("Masukkan link TikTok yang valid.");
      }

      btn.disabled = true;
      btn.textContent = "Memproses...";
      result.style.display = "none";

      try {
        const response = await fetch("/api/download", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url})
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Gagal memproses video.");
        }

        result.style.display = "block";

        if (data.video) {
          videoBtn.style.display = "block";
          videoBtn.onclick = () => {
            window.location.href = data.video;
          };
        }

        if (data.audio) {
          audioBtn.style.display = "block";
          audioBtn.onclick = () => {
            window.location.href = data.audio;
          };
        }
      } catch (error) {
        alert(error.message || "Terjadi kesalahan.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Download Video";
      }
    }
  </script>
</body>
</html>
